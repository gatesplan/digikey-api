[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-digikey-api"
version = "0.2.0"
description = "DigiKey V4 API client with parametric range search and MCP server for AI agent integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "gatesplan", email = "gatesplan@gmail.com"},
]
keywords = ["digikey", "api", "electronics", "components", "v4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "respx>=0.21.0"]
mcp = ["mcp[cli]>=1.0.0"]

[project.scripts]
ff-digikey = "ff_digikey_api.CLI.Cli:main"

[project.urls]
Repository = "https://github.com/gatesplan/digikey-api"
Issues = "https://github.com/gatesplan/digikey-api/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ff_digikey_api*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
